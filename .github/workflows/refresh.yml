# Rebuild from EDGAR/Finnhub/Yahoo and redeploy; nothing ships if a check fails.
name: refresh
on:
  schedule:  # UTC; times shown are EDT, one hour earlier in ET after Nov 1
    - cron: "30 12 * * 1-5"  # 8:30 ET (EDT): after pre-market releases
    - cron: "30 20 * * 1-5"  # 16:30 ET: close
    - cron: "0 1 * * 2-6"    # 21:00 ET: after-close releases
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DCC_SEC_REQUIRED: "1"
      DCC_SEC_URL: ${{ secrets.DCC_SEC_URL }}
      DCC_SEC_TOKEN: ${{ secrets.DCC_SEC_TOKEN }}
      VERCEL_EXPECTED_USER: evoa3
      VERCEL_ORG_ID: team_3frY5U1rw8Yv6c0EVZeDBqwB
      VERCEL_PROJECT_ID: prj_dO9tkbP1346TU7HTrLnQTuxxuqBJ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Evoa3 deployment access
        run: python3 scripts/check_vercel_access.py
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - run: pip install pillow ./vendor/dcc_sec-0.1.1-py3-none-any.whl
      - name: Build and verify the snapshot
        run: python3 season.py build && python3 test_season.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Deploy the verified snapshot
        run: python3 season.py deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Commit the deployed snapshot
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -qm "Refresh data $(date -u +%FT%RZ)"
            git push
          fi
